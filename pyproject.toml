[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rocweather"
version = "0.1.0"
description = "All-in-one image restoration for adverse weather"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "torchvision>=0.16", "Pillow>=9.1", "PyYAML>=6"]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.6"]

[project.scripts]
rocweather = "rocweather.cli:main"

[tool.setuptools]
packages = ["rocweather", "rocweather.models"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
