# 面向显存有限的单卡：保留四级双路结构，减少通道、深度及浅层 K/V。
model:
  channels: [32, 64, 128, 256]
  depths: [1, 1, 3, 1]
  heads: [1, 2, 4, 8]
  kv_reductions: [4, 2, 1, 1]
  tail_channels: [16, 16]
  decoder_depth: 1
  mlp_ratio: 2.0
  dropout: 0.0
  attention_dropout: 0.0
  drop_path: 0.05
  tail_drop_path: 0.05
data:
  crop_size: 256
  horizontal_flip: true
  workers: 2
loss:
  perceptual_weight: 0.0
  identity_weight: 0.0
train:
  epochs: 50
  batch_size: 2
  validate_every: 5
eval:
  resize: 256   # 两种配置使用同一尺寸，便于公平比较。
