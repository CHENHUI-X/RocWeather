# 自适应模型起点：四级通道递增、浅层压缩 K/V、两层中心解码。
model:
  variant: adaptive
  channels: [48, 96, 192, 384]
  depths: [2, 2, 4, 2]
  heads: [1, 2, 4, 8]
  kv_reductions: [4, 2, 1, 1]
  patch_kernels: [7, 3, 3, 3]
  tail_channels: [24, 16]
  decoder_depth: 2
  mlp_ratio: 2.0
  dropout: 0.0
  attention_dropout: 0.0
  drop_path: 0.05
  tail_drop_path: 0.05
  spatial_detail_gate: true
data:
  crop_size: 256
  horizontal_flip: true
  small_image_mode: edge_pad
  # 固定朝向的雨雪数据先保持方向，需要模拟不同相机朝向时再开启。
  rotate_90: false
